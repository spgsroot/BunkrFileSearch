# Both services are self-initializing (each runs the schema migration at
# startup), so no separate init service is needed.
#
# The shared ./data volume must be writable by the container user (uid 10001):
#   mkdir -p data
# Docker Desktop (macOS/Windows) maps ownership automatically.
services:
  sync:
    build: .
    command:
      ["python", "-m", "bunkr_index", "sync",
       "--workers", "${SYNC_WORKERS:-6}",
       "--min-interval", "${SYNC_MIN_INTERVAL:-0.15}",
       "--interval-hours", "${SYNC_INTERVAL_HOURS:-24}"]
    environment:
      BUNKR_DB: /app/data/bunkr.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  web:
    build: .
    command:
      ["python", "-m", "bunkr_index", "serve",
       "--host", "0.0.0.0", "--port", "8000"]
    environment:
      BUNKR_DB: /app/data/bunkr.db
      # Set to protect POST/DELETE /api/albums when the UI is reachable by
      # other machines. Leave empty for local-only, open access.
      BUNKR_ADMIN_TOKEN: ${BUNKR_ADMIN_TOKEN:-}
    volumes:
      - ./data:/app/data
    # Localhost-only by default; set BIND=0.0.0.0 to expose the UI on the
    # network (combine it with BUNKR_ADMIN_TOKEN).
    ports:
      - "${BIND:-127.0.0.1}:${PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/stats', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

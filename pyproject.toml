[project]
name = "bunkr-index"
version = "0.1.0"
description = "Filename-level search over Bunkr album metadata (SQLite + FTS5 trigram)"
requires-python = ">=3.10"
dependencies = [
    "litestar>=2.17",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[project.scripts]
bunkr-index = "bunkr_index.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bunkr_index"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
